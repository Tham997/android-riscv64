<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: Arial, sans-serif;
      color: white;
    }

    .game-shell {
      text-align: center;
    }

    h1 {
      margin-bottom: 12px;
      letter-spacing: 2px;
      font-size: 2rem;
    }

    #scoreboard {
      display: flex;
      justify-content: center;
      gap: 50px;
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 14px;
    }

    #game-board {
      position: relative;
      width: 800px;
      height: 400px;
      background: #000;
      border: 4px solid white;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
      overflow: hidden;
    }

    .paddle {
      position: absolute;
      width: 12px;
      height: 90px;
      border-radius: 6px;
      background: white;
    }

    #left-paddle { left: 12px; top: 155px; }
    #right-paddle { right: 12px; top: 155px; }

    .ball {
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
    }

    .center-line {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
      background: repeating-linear-gradient(
        to bottom,
        white 0,
        white 14px,
        transparent 14px,
        transparent 28px
      );
    }

    .instructions {
      margin-top: 12px;
      color: #d1d5db;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <h1>PONG</h1>

    <div id="scoreboard">
      <div>Player: <span id="player-score">0</span></div>
      <div>Computer: <span id="computer-score">0</span></div>
    </div>

    <div id="game-board">
      <div class="center-line"></div>
      <div id="left-paddle" class="paddle"></div>
      <div id="right-paddle" class="paddle"></div>
      <div id="ball" class="ball"></div>
    </div>

    <div class="instructions">Move with your mouse or Arrow Up / Arrow Down.</div>
  </div>

  <script>
    const boardWidth = 800;
    const boardHeight = 400;
    const paddleWidth = 12;
    const paddleHeight = 90;
    const ballSize = 12;
    const paddleSpeed = 6;
    const maxScore = 5;

    const leftPaddleEl = document.getElementById('left-paddle');
    const rightPaddleEl = document.getElementById('right-paddle');
    const ballEl = document.getElementById('ball');
    const playerScoreEl = document.getElementById('player-score');
    const computerScoreEl = document.getElementById('computer-score');

    const state = {
      leftPaddle: { x: 12, y: 155, width: paddleWidth, height: paddleHeight },
      rightPaddle: { x: boardWidth - 12 - paddleWidth, y: 155, width: paddleWidth, height: paddleHeight },
      ball: { x: boardWidth / 2 - ballSize / 2, y: boardHeight / 2 - ballSize / 2, size: ballSize, dx: 4, dy: 4 },
      playerScore: 0,
      computerScore: 0,
      keys: { up: false, down: false },
      running: true
    };

    function updateScores() {
      playerScoreEl.textContent = String(state.playerScore);
      computerScoreEl.textContent = String(state.computerScore);
    }

    function resetBall(direction = 1) {
      state.ball.x = boardWidth / 2 - state.ball.size / 2;
      state.ball.y = boardHeight / 2 - state.ball.size / 2;
      state.ball.dx = 4 * direction;
      state.ball.dy = (Math.random() * 2 - 1) * 4;
    }

    function handleWallCollision() {
      if (state.ball.y <= 0 || state.ball.y + state.ball.size >= boardHeight) {
        state.ball.dy *= -1;
      }
    }

    function handlePaddleCollision() {
      const leftHit =
        state.ball.x <= state.leftPaddle.x + state.leftPaddle.width &&
        state.ball.x + state.ball.size >= state.leftPaddle.x &&
        state.ball.y + state.ball.size >= state.leftPaddle.y &&
        state.ball.y <= state.leftPaddle.y + state.leftPaddle.height;

      const rightHit =
        state.ball.x + state.ball.size >= state.rightPaddle.x &&
        state.ball.x <= state.rightPaddle.x + state.rightPaddle.width &&
        state.ball.y + state.ball.size >= state.rightPaddle.y &&
        state.ball.y <= state.rightPaddle.y + state.rightPaddle.height;

      if (leftHit) {
        state.ball.x = state.leftPaddle.x + state.leftPaddle.width;
        state.ball.dx = Math.abs(state.ball.dx);
        state.ball.dy += (state.ball.y + state.ball.size / 2 - (state.leftPaddle.y + state.leftPaddle.height / 2)) * 0.08;
      }

      if (rightHit) {
        state.ball.x = state.rightPaddle.x - state.ball.size;
        state.ball.dx = -Math.abs(state.ball.dx);
        state.ball.dy += (state.ball.y + state.ball.size / 2 - (state.rightPaddle.y + state.rightPaddle.height / 2)) * 0.08;
      }
    }

    function scorePoint() {
      if (state.ball.x < 0) {
        state.computerScore += 1;
        updateScores();
        if (state.computerScore >= maxScore) {
          state.running = false;
          alert('Computer wins!');
          return;
        }
        resetBall(1);
      }

      if (state.ball.x + state.ball.size > boardWidth) {
        state.playerScore += 1;
        updateScores();
        if (state.playerScore >= maxScore) {
          state.running = false;
          alert('You win!');
          return;
        }
        resetBall(-1);
      }
    }

    function updateLeftPaddle() {
      if (state.keys.up) {
        state.leftPaddle.y = Math.max(0, state.leftPaddle.y - paddleSpeed);
      }
      if (state.keys.down) {
        state.leftPaddle.y = Math.min(boardHeight - state.leftPaddle.height, state.leftPaddle.y + paddleSpeed);
      }
    }

    function updateRightPaddle() {
      const targetY = state.ball.y + state.ball.size / 2 - state.rightPaddle.height / 2;
      const diff = targetY - state.rightPaddle.y;
      state.rightPaddle.y += Math.sign(diff) * Math.min(4, Math.abs(diff));
      state.rightPaddle.y = Math.max(0, Math.min(boardHeight - state.rightPaddle.height, state.rightPaddle.y));
    }

    function updateBall() {
      state.ball.x += state.ball.dx;
      state.ball.y += state.ball.dy;
      handleWallCollision();
      handlePaddleCollision();
      scorePoint();
    }

    function render() {
      leftPaddleEl.style.top = `${state.leftPaddle.y}px`;
      rightPaddleEl.style.top = `${state.rightPaddle.y}px`;
      ballEl.style.left = `${state.ball.x}px`;
      ballEl.style.top = `${state.ball.y}px`;
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowUp') state.keys.up = true;
      if (event.key === 'ArrowDown') state.keys.down = true;
    });

    document.addEventListener('keyup', (event) => {
      if (event.key === 'ArrowUp') state.keys.up = false;
      if (event.key === 'ArrowDown') state.keys.down = false;
    });

    document.addEventListener('mousemove', (event) => {
      const boardRect = document.getElementById('game-board').getBoundingClientRect();
      const mouseY = event.clientY - boardRect.top;
      state.leftPaddle.y = Math.max(0, Math.min(boardHeight - state.leftPaddle.height, mouseY - state.leftPaddle.height / 2));
    });

    function gameLoop() {
      if (state.running) {
        updateLeftPaddle();
        updateRightPaddle();
        updateBall();
      }
      render();
      requestAnimationFrame(gameLoop);
    }

    resetBall(1);
    updateScores();
    gameLoop();
  </script>
</body>
</html>
